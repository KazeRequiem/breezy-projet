# Identifiants obligatoires (déjà définis dans le YAML mais bonne pratique)
sonar.projectKey=kazerequiem
sonar.organization=kazerequiem

# Emplacement du code source à analyser
sonar.sources=.

# Exclure les fichiers qui n'ont pas besoin d'être scannés (dépendances, tests, etc.)
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/*.spec.js, **/*.test.js

# Encodage du code source
sonar.sourceEncoding=UTF-8