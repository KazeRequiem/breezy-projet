services:
  mongodb:
    image: mongo:7
    container_name: breezy-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - breezy_network

  mongo-express:
    image: mongo-express:latest
    container_name: breezy-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
    entrypoint: ["/bin/sh", "-c", "until nc -z mongodb 27017; do sleep 1; done; node app"]
    networks:
      - breezy_network

  vault:
    image: hashicorp/vault:1.18
    container_name: breezy-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - breezy_network

  vault-init:
    build: ./breezy-back
    container_name: breezy-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    command: ["node", "initVault.js"]
    restart: "no"
    networks:
      - breezy_network

  back:
    build: ./breezy-back
    container_name: breezy-back
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      APP_PORT: ${APP_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
    networks:
      - breezy_network
      - media_net

  front:
    build: ./breezy-front
    container_name: breezy-front
    restart: unless-stopped
    depends_on:
      - back
    networks:
      - breezy_network
      - media_net

volumes:
  mongodata:

networks:
  breezy_network:
    driver: bridge
  media_net:
    external: true
